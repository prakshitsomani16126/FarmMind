<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FarmMind - Register</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header>
    <h1>🌾 FarmMind</h1>
</header>

<main class="container">

    <section class="panel">

        <h2>📝 Create Account</h2>

        {% if error %}
        <div class="recommendation-result">
            ❌ {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <label>Name</label>

            <input
                type="text"
                name="name"
                placeholder="Enter your name"
                required
            >

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Create a password"
                required
            >

            <button type="submit">
                Register
            </button>

        </form>

        <p>
            Already have an account?
            <a href="{{ url_for('login') }}">Login here</a>
        </p>

    </section>

</main>

<footer>
    <p>FarmMind © 2026 | Smart Farm Management System</p>
</footer>

</body>
</html>
